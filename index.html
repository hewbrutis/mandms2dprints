<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>COLORING PRESS</title>
  <meta name="description" content="Original coloring books from COLORING PRESS." />
  <style>
    :root {
      --ink: #1b1714;
      --paper: #f6f1e8;
      --line: #d8cfc0;
      --accent: #b5472a;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: Georgia, "Times New Roman", serif;
      background: var(--paper);
      color: var(--ink);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.25rem;
    }
    main {
      max-width: 36rem;
      width: 100%;
      text-align: center;
    }
    p.kicker {
      margin: 0 0 0.75rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      font-family: system-ui, sans-serif;
      font-size: 0.72rem;
      color: var(--accent);
    }
    h1 {
      margin: 0;
      font-size: clamp(2.4rem, 8vw, 4.2rem);
      font-weight: 700;
      letter-spacing: 0.04em;
      line-height: 1.05;
    }
    .rule {
      width: 4.5rem;
      height: 1px;
      background: var(--line);
      margin: 1.4rem auto;
    }
    p.lede {
      margin: 0;
      font-size: 1.2rem;
      line-height: 1.5;
    }
    p.note {
      margin: 1.5rem 0 0;
      font-family: system-ui, sans-serif;
      font-size: 0.92rem;
      line-height: 1.45;
      color: #5c564e;
    }
  </style>
</head>
<body>
  <main>
    <p class="kicker">Original coloring books</p>
    <h1>COLORING PRESS</h1>
    <div class="rule" aria-hidden="true"></div>
    <p class="lede">These are original coloring books.</p>
    <p class="note">Books first. No marketplace store yet.</p>
  </main>
</body>
</html>
